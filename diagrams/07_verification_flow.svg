<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Verification and Synthesis Flow</text>

  <g fill="none" stroke="#334155" stroke-width="2.5">
    <line x1="270" y1="150" x2="320" y2="150" marker-end="url(#a)"/>
    <line x1="270" y1="290" x2="320" y2="170" marker-end="url(#a)"/>
    <line x1="560" y1="160" x2="610" y2="160" marker-end="url(#a)"/>
    <line x1="850" y1="160" x2="900" y2="160" marker-end="url(#a)"/>
    <polyline points="270,185 295,185 295,440 320,440" marker-end="url(#a)"/>
    <line x1="560" y1="440" x2="610" y2="440" marker-end="url(#a)"/>
  </g>

  <!-- inputs -->
  <rect x="20" y="90" width="250" height="110" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="145" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">RTL design files</text>
  <text x="145" y="144" text-anchor="middle" font-size="12" fill="#334155">pc · control_unit · alu_control</text>
  <text x="145" y="162" text-anchor="middle" font-size="12" fill="#334155">branch_jump · register_file · alu</text>
  <text x="145" y="180" text-anchor="middle" font-size="12" fill="#334155">sign_extend · memories · mips_cpu</text>

  <rect x="20" y="230" width="250" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="145" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c1d95">Self-checking</text>
  <text x="145" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c1d95">testbenches (tb_*.v)</text>
  <text x="145" y="306" text-anchor="middle" font-size="12" fill="#4c1d95">give inputs · compare outputs</text>

  <rect x="320" y="110" width="240" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Compile</text>
  <text x="440" y="164" text-anchor="middle" font-size="13" fill="#1e3a8a">Icarus Verilog</text>
  <text x="440" y="186" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">iverilog -g2001</text>

  <rect x="610" y="110" width="240" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Simulate</text>
  <text x="730" y="164" text-anchor="middle" font-size="13" fill="#1e3a8a">run the testbench</text>
  <text x="730" y="186" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">vvp</text>

  <rect x="900" y="90" width="480" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1140" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">Outputs</text>
  <text x="920" y="148" font-size="14" fill="#14532d">• [PASS] / [FAIL] line for every test</text>
  <text x="920" y="172" font-size="14" fill="#14532d">• Final summary: total passed / failed</text>
  <text x="920" y="196" font-size="14" fill="#14532d">• VCD waveform files (view in GTKWave)</text>
  <text x="920" y="218" font-size="14" fill="#14532d">• CPU cycle trace: PC, instruction, registers</text>

  <!-- synthesis -->
  <rect x="320" y="390" width="240" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="440" y="422" text-anchor="middle" font-size="17" font-weight="bold" fill="#134e4a">Synthesis</text>
  <text x="440" y="444" text-anchor="middle" font-size="13" fill="#134e4a">Yosys (generic)</text>
  <text x="440" y="466" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#134e4a">synth -top mips_cpu</text>

  <rect x="610" y="390" width="240" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="730" y="422" text-anchor="middle" font-size="17" font-weight="bold" fill="#134e4a">Synthesis result</text>
  <text x="730" y="446" text-anchor="middle" font-size="13" fill="#134e4a">22,625 generic cells</text>
  <text x="730" y="468" text-anchor="middle" font-size="13" fill="#134e4a">check: 0 problems</text>
  <text x="290" y="460" text-anchor="end" font-size="12" fill="#334155">RTL files only</text>

  <!-- results table -->
  <g transform="translate(900,262)">
    <rect width="480" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect width="480" height="42" rx="10" fill="#334155"/><rect y="32" width="480" height="10" fill="#334155"/>
    <g fill="#fff" font-size="15" font-weight="bold"><text x="20" y="28">Testbench</text><text x="250" y="28">Checks</text><text x="370" y="28">Result</text></g>
    <g font-size="14" fill="#0f172a">
      <text x="20" y="72">tb_alu.v</text><text x="250" y="72">29 / 29</text>
      <text x="20" y="104">tb_register_file.v</text><text x="250" y="104">20 / 20</text>
      <text x="20" y="136">tb_sign_extend.v</text><text x="250" y="136">11 / 11</text>
      <text x="20" y="168">tb_instruction_memory.v</text><text x="250" y="168">21 / 21</text>
      <text x="20" y="200">tb_data_memory.v</text><text x="250" y="200">30 / 30</text>
      <text x="20" y="232" font-weight="bold">tb_mips_cpu.v</text><text x="250" y="232" font-weight="bold">6 / 6</text>
    </g>
    <g font-size="14" font-weight="bold" fill="#16a34a">
      <text x="370" y="72">PASS</text><text x="370" y="104">PASS</text><text x="370" y="136">PASS</text>
      <text x="370" y="168">PASS</text><text x="370" y="200">PASS</text><text x="370" y="232">PASS</text>
    </g>
    <line x1="20" y1="254" x2="460" y2="254" stroke="#cbd5e1"/>
    <text x="20" y="280" font-size="14" font-weight="bold" fill="#0f172a">Full-CPU programs (result in $t2 and memory[0])</text>
    <text x="20" y="306" font-size="14" fill="#334155">Array sum [10,20,30,40,50] = 150</text>
    <text x="20" y="328" font-size="14" fill="#334155">Maximum of [12,45,7,89,23] = 89    ·    Factorial 5! = 120</text>
  </g>

  <!-- levels -->
  <g transform="translate(20,530)">
    <rect width="830" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#0f172a">Two levels of testing</text>
    <text x="20" y="54" font-size="14" fill="#334155">1. Unit tests – every module is tested alone (ALU, register file, sign extend, memories).</text>
    <text x="20" y="74" font-size="14" fill="#334155">2. System test – the whole CPU runs real MIPS programs and the final answers are checked.</text>
  </g>
</svg>
