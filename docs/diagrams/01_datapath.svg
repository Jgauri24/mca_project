<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="700" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Single-Cycle 32-bit MIPS Processor – Datapath and Control</text>

  <g transform="translate(0,50)">
  <g fill="none" stroke="#334155" stroke-width="2">
    <!-- next PC loop -->
    <polyline points="1080,40 1080,18 18,18 18,405 40,405" marker-end="url(#a)"/>
    <!-- PC -> IMEM -->
    <line x1="120" y1="405" x2="170" y2="405" marker-end="url(#a)"/>
    <!-- PC -> branch/jump -->
    <polyline points="145,405 145,200 1020,200 1020,160" marker-end="url(#a)"/>
    <!-- instruction bus -->
    <line x1="320" y1="405" x2="360" y2="405"/>
    <line x1="360" y1="105" x2="360" y2="640" stroke-width="3"/>
    <!-- opcode -> control -->
    <line x1="360" y1="105" x2="430" y2="105" marker-end="url(#a)"/>
    <!-- [25:0] -> branch/jump -->
    <polyline points="360,230 1080,230 1080,160" marker-end="url(#a)"/>
    <!-- rs, rt -->
    <line x1="360" y1="320" x2="540" y2="320" marker-end="url(#a)"/>
    <line x1="360" y1="360" x2="540" y2="360" marker-end="url(#a)"/>
    <polyline points="440,360 440,415 470,415" marker-end="url(#a)"/>
    <!-- rd -->
    <line x1="360" y1="445" x2="470" y2="445" marker-end="url(#a)"/>
    <!-- RegDst mux -> write reg -->
    <line x1="500" y1="430" x2="540" y2="430" marker-end="url(#a)"/>
    <!-- imm -> sign extend -->
    <line x1="360" y1="565" x2="560" y2="565" marker-end="url(#a)"/>
    <!-- funct -> ALU control -->
    <polyline points="360,640 895,640 895,615" marker-end="url(#a)"/>
    <!-- read data 1 -> ALU A -->
    <line x1="710" y1="330" x2="860" y2="330" marker-end="url(#a)"/>
    <!-- read data 2 -> ALUSrc mux -->
    <line x1="710" y1="420" x2="790" y2="420" marker-end="url(#a)"/>
    <!-- read data 2 -> DMEM write data -->
    <polyline points="760,420 760,520 1000,520 1000,470 1030,470" marker-end="url(#a)"/>
    <!-- sign ext -> ALUSrc mux -->
    <polyline points="690,565 750,565 750,460 790,460" marker-end="url(#a)"/>
    <!-- sign ext -> branch/jump -->
    <polyline points="720,565 720,260 1140,260 1140,160" marker-end="url(#a)"/>
    <!-- ALUSrc mux -> ALU B -->
    <line x1="820" y1="440" x2="860" y2="440" marker-end="url(#a)"/>
    <!-- ALU control -> ALU -->
    <line x1="900" y1="560" x2="900" y2="444" marker-end="url(#a)"/>
    <!-- ALU result -> DMEM address -->
    <line x1="940" y1="390" x2="1030" y2="390" marker-end="url(#a)"/>
    <!-- ALU result bypass -> MemToReg mux (0) -->
    <polyline points="1012,390 1012,315 1250,315 1250,440 1260,440" marker-end="url(#a)"/>
    <!-- zero -> branch/jump -->
    <polyline points="935,355 990,355 990,290 1185,290 1185,160" marker-end="url(#a)"/>
    <!-- DMEM read data -> MemToReg mux (1) -->
    <polyline points="1200,480 1235,480 1235,520 1260,520" marker-end="url(#a)"/>
    <!-- write-back loop -->
    <polyline points="1292,480 1340,480 1340,770 520,770 520,470 540,470" marker-end="url(#a)"/>
  </g>
  <!-- junction dots -->
  <g fill="#334155">
    <circle cx="145" cy="405" r="4"/><circle cx="360" cy="405" r="4"/><circle cx="440" cy="360" r="4"/>
    <circle cx="760" cy="420" r="4"/><circle cx="720" cy="565" r="4"/><circle cx="1012" cy="390" r="4"/>
  </g>
  <!-- bus labels -->
  <g font-size="13" fill="#334155">
    <text x="354" y="99" text-anchor="end">opcode [31:26]</text>
    <text x="366" y="224">[25:0] jump index</text>
    <text x="366" y="314">[25:21] rs</text>
    <text x="366" y="354">[20:16] rt</text>
    <text x="366" y="439">[15:11] rd</text>
    <text x="366" y="559">[15:0] imm</text>
    <text x="366" y="634">[5:0] funct</text>
    <text x="324" y="398">32</text>
    <text x="160" y="194">PC</text>
    <text x="728" y="254">sign-extended imm</text>
    <text x="996" y="284">Zero</text>
    <text x="948" y="384">ALU result</text>
    <text x="1020" y="309">ALU result</text>
    <text x="770" y="514">rt data (store)</text>
    
    <text x="1000" y="764">Write-back data (to register file)</text>
    <text x="30" y="12">Next PC</text>
  </g>

  <!-- PC (Gauri Jindal) -->
  <rect x="40" y="360" width="80" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="402" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">PC</text>
  <text x="80" y="424" text-anchor="middle" font-size="12" fill="#1e3a8a">pc.v</text>

  <!-- Instruction memory (Manas Saxena) -->
  <rect x="170" y="320" width="150" height="170" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="245" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Instruction</text>
  <text x="245" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Memory</text>
  <text x="245" y="428" text-anchor="middle" font-size="12" fill="#7c2d12">256 × 32 ROM</text>
  <text x="245" y="470" text-anchor="middle" font-size="11" fill="#7c2d12">instruction_memory.v</text>
  <text x="176" y="400" font-size="11" fill="#7c2d12">Addr</text>

  <!-- Control unit (Gauri Jindal) -->
  <rect x="430" y="40" width="180" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Control Unit</text>
  <text x="520" y="88" text-anchor="middle" font-size="11" fill="#1e3a8a">control_unit.v</text>
  <text x="520" y="112" text-anchor="middle" font-size="11" fill="#1e3a8a">RegDst · RegWrite · ALUSrc</text>
  <text x="520" y="128" text-anchor="middle" font-size="11" fill="#1e3a8a">ALUOp · MemRead · MemWrite</text>
  <text x="520" y="144" text-anchor="middle" font-size="11" fill="#1e3a8a">MemToReg · Branch · Jump</text>
  <g fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4">
    <line x1="610" y1="85" x2="950" y2="85" marker-end="url(#b)"/>
    <line x1="610" y1="125" x2="950" y2="125" marker-end="url(#b)"/>
  </g>
  <text x="625" y="79" font-size="12" fill="#2563eb">Branch</text>
  <text x="625" y="119" font-size="12" fill="#2563eb">Jump</text>

  <!-- Branch / Jump logic (Gauri Jindal) -->
  <rect x="950" y="40" width="260" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1080" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Branch / Jump Logic</text>
  <text x="1080" y="86" text-anchor="middle" font-size="11" fill="#1e3a8a">branch_jump.v</text>
  <text x="1080" y="108" text-anchor="middle" font-size="11" fill="#1e3a8a">PC+4 · PC+4+(imm≪2) · jump target</text>
  <text x="1080" y="124" text-anchor="middle" font-size="11" fill="#1e3a8a">Jump &gt; (Branch AND Zero) &gt; PC+4</text>

  <!-- RegDst mux -->
  <polygon points="470,400 500,410 500,450 470,460" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="474" y="420" font-size="10">0</text><text x="474" y="450" font-size="10">1</text>
  <line x1="485" y1="404" x2="485" y2="386" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="485" y="380" text-anchor="middle" font-size="12" fill="#2563eb">RegDst</text>

  <!-- Register file (Sanchit Garg) -->
  <rect x="540" y="290" width="170" height="200" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Register</text>
  <text x="625" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">File</text>
  <text x="625" y="426" text-anchor="middle" font-size="11" fill="#14532d">32 × 32</text>
  <text x="625" y="482" text-anchor="middle" font-size="11" fill="#14532d">register_file.v</text>
  <g font-size="10" fill="#14532d">
    <text x="546" y="324">Read reg 1</text><text x="546" y="364">Read reg 2</text>
    <text x="546" y="434">Write reg</text><text x="546" y="460">Write data</text>
    <text x="704" y="334" text-anchor="end">Read data 1</text><text x="704" y="424" text-anchor="end">Read data 2</text>
  </g>
  <line x1="625" y1="290" x2="625" y2="275" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="625" y="285" text-anchor="middle" font-size="12" fill="#2563eb" dx="40">RegWrite</text>

  <!-- Sign extend (Sanchit Garg) -->
  <ellipse cx="625" cy="565" rx="65" ry="27" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Sign Extend</text>
  <text x="625" y="578" text-anchor="middle" font-size="10" fill="#14532d">16 → 32 bit</text>

  <!-- ALUSrc mux -->
  <polygon points="790,400 820,410 820,470 790,480" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="794" y="424" font-size="10">0</text><text x="794" y="464" font-size="10">1</text>
  <line x1="805" y1="404" x2="805" y2="386" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="805" y="380" text-anchor="middle" font-size="12" fill="#2563eb">ALUSrc</text>

  <!-- ALU (Sanchit Garg) -->
  <polygon points="860,300 940,340 940,420 860,460 860,400 878,380 860,360" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="905" y="385" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">ALU</text>
  <text x="905" y="402" text-anchor="middle" font-size="10" fill="#14532d">alu.v</text>

  <!-- ALU control (Gauri Jindal) -->
  <rect x="830" y="560" width="140" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="900" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ALU Control</text>
  <text x="900" y="601" text-anchor="middle" font-size="10" fill="#1e3a8a">alu_control.v</text>
  <line x1="790" y1="588" x2="830" y2="588" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="786" y="592" text-anchor="end" font-size="12" fill="#2563eb">ALUOp</text>

  <!-- Data memory (Manas Saxena) -->
  <rect x="1030" y="340" width="170" height="170" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1115" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Data Memory</text>
  <text x="1115" y="438" text-anchor="middle" font-size="12" fill="#7c2d12">256 × 32 RAM</text>
  <text x="1115" y="500" text-anchor="middle" font-size="11" fill="#7c2d12">data_memory.v</text>
  <g font-size="10" fill="#7c2d12">
    <text x="1036" y="394">Address</text><text x="1036" y="474">Write data</text>
    <text x="1194" y="484" text-anchor="end">Read data</text>
  </g>
  <line x1="1115" y1="510" x2="1115" y2="528" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1115" y="542" text-anchor="middle" font-size="12" fill="#2563eb">MemRead · MemWrite</text>

  <!-- MemToReg mux -->
  <polygon points="1260,410 1292,422 1292,538 1260,550" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1264" y="444" font-size="10">0</text><text x="1264" y="524" font-size="10">1</text>
  <line x1="1276" y1="568" x2="1276" y2="546" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1276" y="582" text-anchor="middle" font-size="12" fill="#2563eb">MemToReg</text>

  <!-- Legend -->
  <g transform="translate(20,665)" font-size="13" fill="#0f172a">
    <rect x="0" y="0" width="330" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="22" font-weight="bold">Legend</text>
    <rect x="12" y="34" width="18" height="14" fill="#dbeafe" stroke="#2563eb"/><text x="38" y="46">Gauri Jindal – Control &amp; Integration</text>
    <rect x="12" y="56" width="18" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="38" y="68">Sanchit Garg – Execution Unit</text>
    <rect x="12" y="78" width="18" height="14" fill="#ffedd5" stroke="#ea580c"/><text x="38" y="90">Manas Saxena – Memory Subsystem</text>
    <line x1="12" y1="110" x2="30" y2="110" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/><text x="38" y="114">Control signal (from Control Unit)</text>
  </g>
  </g>
</svg>
